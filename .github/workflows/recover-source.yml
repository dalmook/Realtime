name: Restore verified SCM source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-source.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: source-recovery
  cancel-in-progress: false
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recovered-source-inspection
          run-id: 36520252250
          github-token: ${{ github.token }}
          path: recovered
      - name: Verify and restore source files
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil
          root=pathlib.Path.cwd(); recovered=root/'recovered'
          sha=lambda data:hashlib.sha256(data).hexdigest()
          manifest_raw=(recovered/'MANIFEST.json').read_bytes()
          assert sha(manifest_raw)=='ab9cef3a1a123e2f33855ad00ff1f0eb9812e941ffaf2295ced6f9ea7ddbceba'
          manifest=json.loads(manifest_raw)['files']
          for p in recovered.rglob('*'):
              if not p.is_file(): continue
              name=p.relative_to(recovered).as_posix()
              assert not p.is_symlink()
              if name!='MANIFEST.json': assert sha(p.read_bytes())==manifest[name]['sha256'],name
          packed=b''.join((root/f'.recovery/sup_{i:02d}.b64').read_bytes() for i in range(1,11))
          assert sha(packed)=='717c87927b54adf2e2c52622f09f3b5e028074253f0fe8dfd2be29a5789e00aa'
          supplement=json.loads(lzma.decompress(base64.b64decode(packed,validate=True)))
          assert len(supplement)==24
          for name,text in supplement.items():
              p=pathlib.PurePosixPath(name)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] in {'scm_db','sql','tests','tools'}
              data=text.encode('utf-8')
              assert sha(data)==manifest[name]['sha256'],name
              dest=recovered/name;dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(data)
          for p in list(recovered.rglob('*')):
              if p.is_file():
                  dest=root/p.relative_to(recovered);dest.parent.mkdir(parents=True,exist_ok=True);dest.write_bytes(p.read_bytes())
          (root/'VERSION').write_text('1.2.2-realtime\n')
          (root/'tools/publish_github.py').write_text('''"""Display the approved repository only; no credential reads or uploads."""
          print("Repository: https://github.com/dalmook/Realtime")
          print("Demo: https://dalmook.github.io/Realtime/")
          print("ZIP: https://github.com/dalmook/Realtime/releases/latest/download/SCMRealtimeDB_portable.zip")
          print("Company: extract ZIP, configure .env, run START.cmd. Demo: DEMO.cmd.")
          ''',encoding='utf-8')
          for directory in ['.import','.recovery','recovered']:shutil.rmtree(root/directory)
          print('All restored files matched trusted checksums; staging removed.')
          PY
      - name: Test restored source without company services
        run: python -S -m unittest discover -s tests -v
      - name: Build synthetic demo and package
        run: |
          python tools/build_site.py
          python tools/build_package.py --output release/SCMRealtimeDB_portable.zip
      - name: Commit restored source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Restore portable SCM source, synthetic demo and remove staging fragments'
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SCMRealtimeDB-restored-portable
          path: release/SCMRealtimeDB_portable.zip
